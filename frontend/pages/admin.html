<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent K — 管理後台</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/themes.css" />
  <link rel="stylesheet" href="../assets/css/chat.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <script>(function(){
    var t=localStorage.getItem('kway_theme');if(t)document.documentElement.setAttribute('data-theme',t);
    // Admin gate: redirect non-admin users to chat
    try{var u=JSON.parse(sessionStorage.getItem('kway_user')||'{}');if(u.role!=='admin'){window.location.href='chat.html';}}catch(_){window.location.href='chat.html';}
  })();</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- Header (identical structure to chat.html) -->
<div class="page-chat-root">
<header class="page-chat-topbar" role="banner">
  <div class="page-chat-topbar-left">
    <a href="index.html" class="logo page-chat-topbar-logo" aria-label="Agent K 首頁">
      <div class="logo-mark" aria-hidden="true" style="background:none;">
        <img src="../assets/images/kw_logo.png" width="28" height="28" alt="" />
      </div>
      <div class="logo-text">
        <span class="brand">Agent K</span>
        <span class="sub">凱衛資訊 AI 智能平台</span>
      </div>
    </a>
    <div class="page-chat-topbar-divider" aria-hidden="true"></div>
    <a href="chat.html" class="page-chat-workspace-tag" style="text-decoration:none;" aria-label="資訊處工作區">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      資訊處工作區
    </a>
    <!-- 設計工作流 moved to chat.html's left sidebar 2026-04-23;
         removed here since the sidebar is now the single entry point. -->
    <span class="page-chat-workspace-tag active" style="pointer-events:none;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg>
      管理後台
    </span>
  </div>
  <div class="page-chat-topbar-right">
    <button class="page-chat-topbar-icon-btn" aria-label="通知">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <button class="page-chat-topbar-icon-btn" aria-label="設定" onclick="window.location.href='settings.html'">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="page-chat-topbar-avatar" id="adminUserAvatar" aria-label="使用者"></div>
  </div>
</header>

<!-- Body: Primary Nav (main menu) + Admin Sidebar + Content -->
<div class="admin-body">

  <!-- Primary navigation — mirrored from chat.html so the main menu
       stays visible across pages (requested 2026-04-23). None of the
       items are marked is-active here because on admin pages the
       top-bar 管理後台 tag carries the active state instead. -->
  <aside class="page-chat-primary-nav admin-primary-nav" aria-label="主選單">
    <div class="page-chat-primary-nav-header">
      <span class="page-chat-primary-nav-kicker">主選單</span>
    </div>
    <nav class="page-chat-primary-nav-menu">
      <a class="page-chat-primary-nav-btn" href="chat.html" aria-label="AI Chat">
        <span class="page-chat-primary-nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8.5 10h7"/><path d="M8.5 14h4"/>
          </svg>
        </span>
        <span class="page-chat-primary-nav-label">AI Chat</span>
      </a>
      <button class="page-chat-primary-nav-btn" type="button" onclick="window.location.href='chat.html'; setTimeout(()=>window.showToast&&window.showToast('Agent 管理功能即將開放','info'),300);" aria-label="Agent 管理">
        <span class="page-chat-primary-nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M19 8v6"/><path d="M16 11h6"/>
          </svg>
        </span>
        <span class="page-chat-primary-nav-label">Agent 管理</span>
      </button>
      <button class="page-chat-primary-nav-btn" type="button" onclick="window.location.href='chat.html'; setTimeout(()=>window.showToast&&window.showToast('專案管理功能即將開放','info'),300);" aria-label="專案管理">
        <span class="page-chat-primary-nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4L11 7h7.5A2.5 2.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M3 10h18"/>
          </svg>
        </span>
        <span class="page-chat-primary-nav-label">專案管理</span>
      </button>
      <a class="page-chat-primary-nav-btn" href="chat.html?openSkillManager=1" aria-label="技能管理">
        <span class="page-chat-primary-nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </span>
        <span class="page-chat-primary-nav-label">技能管理</span>
      </a>
      <a class="page-chat-primary-nav-btn" href="chat.html?openWorkflow=1" aria-label="設計工作流">
        <span class="page-chat-primary-nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 17h7M17.5 14v7"/>
          </svg>
        </span>
        <span class="page-chat-primary-nav-label">設計工作流</span>
      </a>
      <button class="page-chat-primary-nav-btn" type="button" onclick="window.location.href='chat.html'; setTimeout(()=>window.showToast&&window.showToast('資源管理功能即將開放','info'),300);" aria-label="資源管理">
        <span class="page-chat-primary-nav-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12 4 7.5"/><path d="M12 12l8-4.5"/><path d="M12 21v-9"/>
          </svg>
        </span>
        <span class="page-chat-primary-nav-label">資源管理</span>
      </button>
    </nav>
  </aside>

  <!-- Sidebar -->
  <nav class="admin-sidebar" id="adminSidebar">
    <div class="admin-nav">
      <a class="admin-nav-item active" href="#/dashboard" data-page="dashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="admin-nav-item" href="#/skills" data-page="skills">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span>Skills 管理</span>
      </a>
      <a class="admin-nav-item" href="#/workflows" data-page="workflows">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 17h7M17.5 14v7"/></svg>
        <span>Workflows</span>
      </a>
      <a class="admin-nav-item" href="#/schedules" data-page="schedules">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>排程監控</span>
      </a>
      <a class="admin-nav-item" href="#/tokens" data-page="tokens">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
        <span>Token 用量</span>
      </a>
      <a class="admin-nav-item" href="#/users" data-page="users">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>使用者</span>
      </a>
      <a class="admin-nav-item" href="#/settings" data-page="settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>系統設定</span>
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="admin-content" id="adminContent">
    <!-- Pages are injected here by JS -->
  </main>

</div>
</div><!-- /page-chat-root -->

<script src="../config.js"></script>
<script src="../assets/js/view-state.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
